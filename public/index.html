<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Archive Downloader</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.5; }
    body { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { margin-bottom: .25rem; } .muted { color: #6b7280; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.5rem 0; }
    input { flex: 1 1 30rem; padding: .8rem; font: inherit; border: 1px solid #9ca3af; border-radius: .4rem; }
    button { cursor: pointer; padding: .8rem 1rem; font: inherit; border: 0; border-radius: .4rem; background: #1d4ed8; color: white; }
    button.secondary { background: #374151; } button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .error { padding: .8rem; border-left: 4px solid #dc2626; background: #fee2e2; color: #7f1d1d; }
    .item { border-top: 1px solid #d1d5db; margin-top: 2rem; padding-top: 1rem; } .file { display: flex; gap: 1rem; align-items: center; border: 1px solid #d1d5db; border-radius: .5rem; padding: .8rem; margin: .6rem 0; }
    .file-main { flex: 1; min-width: 0; } .name { overflow-wrap: anywhere; font-weight: 600; } .meta { color: #6b7280; font-size: .9rem; }
    a { color: #1d4ed8; } .restricted { opacity: .65; } @media (prefers-color-scheme: dark) { body { background: #111827; color: #f9fafb; } .file { border-color: #4b5563; } .muted, .meta { color: #9ca3af; } .error { background: #450a0a; color: #fecaca; } a { color: #93c5fd; } }
  </style>
</head>
<body>
  <main>
    <h1>Internet Archive Downloader</h1>
    <p class="muted">Analyze a public Internet Archive item and stream its available files through this service.</p>
    <form id="analyze-form"><label for="archive-url">Internet Archive URL</label><input id="archive-url" name="url" type="url" required placeholder="https://archive.org/details/example"><button type="submit">Analyze</button></form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" aria-live="polite"></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
